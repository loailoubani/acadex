name: Check lectures

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lectures
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Read the followed courses
        env:
          FOLLOW_URL: ${{ vars.FOLLOW_URL }}
        run: python3 .github/scripts/check_lectures.py
      - name: Save the result
        run: |
          git config user.name "Loai Housam Loubani"
          git config user.email "178174692+loailoubani@users.noreply.github.com"
          git add lectures.json
          git diff --cached --quiet || { git commit -m "Update lectures"; git push; }
